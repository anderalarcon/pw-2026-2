<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personalizar perfil</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="theme-green">
    <section class="card">
      <div class="avatar">J</div>
      <h1 id="profile-name" class="name">Jhon Doe</h1>
      <p id="profile-bio" class="bio">
        Estudiante de Programación Web. Personaliza el tema de tu perfil.
      </p>

      <h2 class="section-title">Elige tu tema</h2>

      <div class="theme-buttons">
        <button id="btn-green" class="theme-btn" type="button">Verde</button>
        <button id="btn-blue" class="theme-btn" type="button">Azul</button>
        <button id="btn-purple" class="theme-btn" type="button">Morado</button>
        <button id="btn-dark" class="theme-btn" type="button">Oscuro</button>
      </div>

      <p id="theme-name" class="theme-name">Tema seleccionado: Verde</p>
    </section>

    <script src="./script.js"></script>
  </body>
</html>
